[package]
name = "pcassist"
version = "0.1.0"
edition = "2021"

[dependencies]
assistant-config = { path = "../../crates/assistant-config" }
assistant-core = { path = "../../crates/assistant-core" }
assistant-tts = { path = "../../crates/assistant-tts" }
assistant-zoom = { path = "../../crates/assistant-zoom" }
global-hotkey = "0.10.0"
slint = "1.19.0"
tray-icon = "0.26.1"

[build-dependencies]
slint-build = "1.19.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading","Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
